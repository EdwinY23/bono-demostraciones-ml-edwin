name: Publicar bono académico de Edwin Yunis
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bono-ml-github-pages
  cancel-in-progress: false

jobs:
  preparar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer material académico original
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          zip_path = Path("Bono_Academico_Demostraciones_ML_Edwin_Yunis.zip")
          if zip_path.exists():
              with ZipFile(zip_path) as archive:
                  for item in archive.infolist():
                      path = Path(item.filename)
                      if path.is_absolute() or ".." in path.parts:
                          raise ValueError(f"Ruta insegura en el ZIP: {item.filename}")
                      if path.parts[:2] == (".github", "workflows"):
                          continue
                      if path.name == "generar_html.py":
                          continue
                      if item.is_dir():
                          continue
                      target = Path(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(item))
              print("Se extrajeron los capítulos y el sitio web.")
          else:
              print("El contenido ya está integrado en el repositorio.")
          docs = Path("docs")
          expected = [docs / "index.html"] + [docs / f"{i:02d}.html" for i in range(1, 9)]
          missing = [str(path) for path in expected if not path.is_file()]
          if missing:
              raise FileNotFoundError("Faltan páginas: " + ", ".join(missing))
          index = (docs / "index.html").read_text(encoding="utf-8")
          assert "Edwin Yunis" in index
          assert "Jairo Andrés Serrano" not in index
          assert "Bono académico" in index
          assert (docs / "figuras/arbol_corregido.png").is_file()
          print("Sitio verificado: Edwin Yunis, 8 capítulos y árbol corregido.")
          PY

      - name: Integrar archivos descomprimidos al repositorio
        shell: bash
        run: |
          if [ -f Bono_Academico_Demostraciones_ML_Edwin_Yunis.zip ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git rm --cached -- Bono_Academico_Demostraciones_ML_Edwin_Yunis.zip
            rm -f Bono_Academico_Demostraciones_ML_Edwin_Yunis.zip
            if ! git diff --cached --quiet; then
              git commit -m "Integrar demostraciones individuales y sitio académico"
              git push
            fi
          fi

      - name: Verificar navegación y autoría antes de publicar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("docs")
          assert (root / "styles.css").is_file(), "Falta hoja de estilos"
          index = (root / "index.html").read_text(encoding="utf-8")
          for n in range(1, 9):
              file = f"{n:02d}.html"
              assert f'href="{file}"' in index, f"Sin enlace a {file}"
              page = (root / file).read_text(encoding="utf-8")
              assert "Edwin Yunis" in page, f"Falta autor en {file}"
              assert "Jairo Andrés Serrano" not in page, f"Autoría errónea en {file}"
          print("OK: 8 capítulos enlazados, recursos y autoría individual")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar páginas
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar sitio
        id: deployment
        uses: actions/deploy-pages@v4
